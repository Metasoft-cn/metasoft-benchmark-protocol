[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-core"
version = "0.1.0.dev1"
description = "Unified benchmark runtime for the Metasoft Benchmark Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MBP contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["benchmark_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
